id: amazon_us
name: Amazon US
country: us
buyer_context:
  - text: 상품명·불릿 포인트·후기 평점을 중심으로 비교 구매한다는 가설
    verified: false
format_rules:
  - rule: 상품명 글자 수 제한
    value: 2026-07-27부터 미디어를 제외한 전 카테고리에서 공백 포함 75자 이하(브랜드명 포함). 그 이전 규칙은 200자. 복수의 2차 자료가 일치하지만 Seller Central 공식 페이지는 직접 확인하지 못함
    verified: false
    source: 2차 자료(SellerSprite, Zentail, Amalytix 2026) 종합. Seller Central 'Product title requirements' 에서 최종 확인 필요
    # 코드가 읽는 한도. verified 가 false 인 동안은 경고만 하고 자동으로 줄이지 않는다. 공식 확인 후 verified: true 로 바꾸면 자기검수가 자동으로 줄인다.
    limit: {section: 상품명, max_chars: 75, unit: chars, counts_spaces: true}
  - rule: 상품명 금지 표현
    value: 판촉 문구(free shipping, best seller), 전부 대문자, 특수문자 반복 금지라는 2차 자료
    verified: false
    source: 2차 자료. Seller Central 에서 최신 규칙 확인 필요
  - rule: 불릿 포인트 개수와 길이
    value: 5개가 일반적. 길이는 카테고리 템플릿마다 달라(총 1,000자 이내 권장이라는 2차 자료도 있음) 등록 화면에서 확인 필요
    verified: false
    source: Seller Central 카테고리 템플릿에서 직접 확인 필요
reviewed_at: 2026-11-16
references:
  - https://www.sellersprite.com/en/blog/amazon-75-character-title-limit-2026
  - https://www.zentail.com/blog/amazon-is-cutting-product-titles-to-75-characters-heres-what-sellers-need-to-know
  - https://amalytix.com/en/knowledge/seo/amazon-product-title
