id: amazon_jp
name: Amazon Japan
country: jp
buyer_context:
  - text: 상품명·불릿 포인트·후기 평점을 중심으로 비교 구매하고, 프라임 배송 여부에 민감하다는 가설
    verified: false
  - text: 세로로 긴 상세 이미지보다 텍스트 설명(불릿, 상품 설명)의 비중이 다른 일본 쇼핑몰보다 크다는 가설
    verified: false
# 등록 형식 규칙. verified: false 인 항목은 화면에 '미확인'으로 표시하고 확정 규칙처럼 쓰지 않는다.
format_rules:
  - rule: 상품명 글자 수 제한
    value: 2026-07-27부터 미디어를 제외한 전 카테고리에서 공백 포함 75자 이하(브랜드명 포함). 그 이전 규칙은 전각 80자 이내. 복수의 2차 자료가 일치하지만 Seller Central 공식 페이지는 직접 확인하지 못함
    verified: false
    source: 2차 자료(SellerSprite, stockcrew 2026-07) 종합. Seller Central '商品名の要件とガイドライン' 에서 최종 확인 필요
    # 코드가 읽는 한도. verified 가 false 인 동안은 경고만 하고 자동으로 줄이지 않는다. 공식 확인 후 verified: true 로 바꾸면 자기검수가 자동으로 줄인다.
    limit: {section: 상품명, max_chars: 75, unit: chars, counts_spaces: true}
  - rule: 상품명 표기 규칙
    value: 공백·영숫자·하이픈은 반각, 반각 가타카나 금지, '送料無料'·'ベストセラー' 같은 판촉 문구 금지(2024년 기준 2차 자료)
    verified: false
    source: 2차 자료. Seller Central 에서 최신 규칙 확인 필요
  - rule: 불릿 포인트 개수와 길이
    value: 5개가 일반적. 글자 수 제한은 카테고리 템플릿마다 달라 등록 화면에서 확인 필요
    verified: false
    source: Seller Central 카테고리 템플릿에서 직접 확인 필요
  - rule: 상품 하이라이트(商品のハイライト)
    value: 2026년 신제도. 소재·추천 용도 같은 보조 정보를 최대 125자로 적는 칸이 생겼고 검색 대상이 된다는 2차 자료
    verified: false
    source: 2차 자료(stockcrew 2026-07). 공식 안내 확인 필요
reviewed_at: 2026-11-16
references:
  - https://www.sellersprite.com/jp/blog/amazon-product-title-rules
  - https://stockcrew.co.jp/insights/article_jiji_amazon_title_75char_2026-07-23
