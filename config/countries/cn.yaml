name: 중국 본토
language: zh
language_name: 중국어(간체)
# 아래 내용은 '고정된 사실'이 아니라 초기 가설이다. 실제 고객 반응으로 수정한다.
hypotheses:
  - text: 성분·함량 같은 구체적 수치와 실제 사용 후기 인용이 신뢰에 영향을 준다는 가설
    verified: false
  - text: 한국 화장품(韩妆)은 인지도가 있지만 경쟁이 치열해 차별점을 첫 화면에서 보여 줘야 한다는 가설
    verified: false
  - text: 모바일에서 세로로 긴 상세 이미지를 스크롤하며 보는 구매 흐름이 일반적이라는 가설
    verified: false
writing_style:
  - 간체자를 쓰고, 짧은 문장과 불릿 중심으로 구성한다
  - 최상급·절대 표현(最佳, 第一 등)은 광고법 제한이 있으므로 수치와 성분으로 설명한다
  - 브랜드명은 중문 표기와 영문 표기를 함께 쓴다
reviewed_at: 2026-11-16
references:
