id: cn_cosmetics
name: 중국 화장품 효능 표현 주의 목록
applies_to: {country: cn, category: skincare}
# 화장품감독관리조례·화장품 표시 관리 규정(의료 용어와 허위 효능 표시 금지, 특수화장품 등록)을 참고한 초안이다.
# 법률 검토를 거친 목록이 아니므로 verified: false.
verified: false
reviewed_at: 2026-11-16
references:
  - 化妆品监督管理条例, 化妆品标签管理办法(원문 확인 필요)
rules:
  - pattern: '治疗|治愈|根治|消炎|抗炎|杀菌|抗菌|抑菌|祛疤|细胞再生|修复细胞|医用|药用|药妆|处方'
    reason: 의료 용어나 치료 효과 표현은 화장품 표시에 쓸 수 없다. '药妆' 표기 자체가 금지 대상이다.
    suggestion: '舒缓(진정), 保湿(보습), 改善肤感 같은 허용 범위 표현으로 바꾼다'
    severity: 높음
  - pattern: '美白|祛斑|防晒|防脱|染发|烫发'
    reason: 특수화장품 등록(注册)이 있어야 표시할 수 있는 효능이다.
    suggestion: '등록 여부를 확인하기 전에는 삭제한다'
    severity: 높음
  - pattern: '抗敏|脱敏|抗过敏|祛痘|去痘|痘痘.{0,4}(消|没|好)'
    reason: 항알레르기·여드름 치료를 암시하는 표현이다.
    suggestion: '舒缓, 温和 같은 사용감 표현으로 바꾼다'
    severity: 높음
  - pattern: '\d+\s?(天|小时|周|分钟)(见效|内见|后见|即|内改善)'
    reason: 기간 효과 주장(예 7天见效)은 시험 근거가 필요하고 효능 보장으로 읽힐 수 있다.
    suggestion: '근거 자료가 없으면 삭제한다'
    severity: 높음
  - pattern: '医生推荐|皮肤科.{0,3}(推荐|测试|认证)|临床(验证|证明|测试)|专家认证'
    reason: 의사 추천·임상·전문가 표현은 증빙 자료가 있어야 한다.
    suggestion: '증빙이 없으면 삭제한다'
    severity: 중간
