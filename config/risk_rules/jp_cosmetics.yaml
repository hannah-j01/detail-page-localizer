id: jp_cosmetics
name: 일본 화장품 효능 표현 주의 목록
applies_to: {country: jp, category: skincare}
# 일본 의약품의료기기법(약기법)과 화장품 광고 기준을 참고해 만든 '주의 표현' 목록이다.
# 법률 검토를 거친 목록이 아니므로 verified: false. 탐지 결과는 '추가 검토 필요' 신호일 뿐이다.
verified: false
reviewed_at: 2026-10-29
references:
  - 일본 후생노동성 '의약품 등 적정광고기준' 및 화장품 효능 범위(원문 확인 필요)
rules:
  - pattern: '治る|治す|治療|完治|根治'
    reason: 치료를 암시하는 표현. 화장품은 질병 치료 효과를 표방할 수 없다.
    suggestion: '肌を整える, 肌荒れを防ぐ 등 화장품 효능 범위 안의 표현으로 바꾼다'
    severity: 높음
  - pattern: '(シミ|シワ|ニキビ|毛穴|赤み|くすみ).{0,4}(消える|消す|なくなる|改善)'
    reason: 피부 고민이 사라지거나 개선된다는 표현은 일반 화장품 효능 범위를 넘을 수 있다.
    suggestion: '사용감이나 보습·정돈 등 허용 범위의 표현으로 바꾸고, 필요하면 전문가 검토를 받는다'
    severity: 높음
  - pattern: '美白|ホワイトニング|薬用'
    reason: 의약부외품 승인이 있어야 쓸 수 있는 표현일 수 있다.
    suggestion: '승인 여부를 확인하기 전에는 삭제한다'
    severity: 높음
  - pattern: '再生|細胞|医薬品'
    reason: 피부 구조나 의약품 효과를 암시하는 표현이다.
    suggestion: '삭제하거나 사용감 중심 표현으로 바꾼다'
    severity: 높음
  - pattern: '\d+\s?(日|週間|時間)(で|間で|後に|後には)'
    reason: 기간 효과 주장(예 '3日で')은 시험 근거가 필요하고 효능 보장으로 읽힐 수 있다.
    suggestion: '근거 자료가 없으면 삭제한다'
    severity: 높음
  - pattern: '即効|アンチエイジング'
    reason: 효과의 속도나 노화 방지를 단정하는 표현이다.
    suggestion: "'エイジングケア※' 처럼 주석을 붙이거나 삭제한다(※年齢に応じたお手入れ)"
    severity: 중간
