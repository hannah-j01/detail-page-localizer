id: jp_general
name: 일본 공통 과장·근거 필요 표현
applies_to: {country: jp, category: any}
verified: false
reviewed_at: 2026-10-29
references:
  - 일본 경품표시법(부당표시) 관련 일반 원칙(원문 확인 필요)
rules:
  - pattern: 'No\.?\s?1|ナンバーワン|第?1位|売上1位'
    reason: 순위 표현은 조사 기관, 기간, 대상 등 객관적 근거가 필요하다.
    suggestion: '근거 자료가 없으면 삭제한다. 있으면 출처와 기간을 주석으로 표기한다'
    severity: 높음
  - pattern: '世界初|日本初|業界初|唯一'
    reason: 독점성·최초 표현은 근거가 필요하다.
    suggestion: '근거가 없으면 삭제한다'
    severity: 높음
  - pattern: '皮膚科(医)?(テスト|試験)済|皮膚科医(推奨|監修)|臨床(試験|実証)'
    reason: 테스트·추천 표현은 증빙 자료가 있어야 한다.
    suggestion: "증빙이 있으면 '※すべての方に刺激が起きないわけではありません' 같은 주석을 함께 단다. 없으면 삭제한다"
    severity: 높음
  - pattern: '刺激ゼロ|副作用(が)?な|誰にでも|すべての肌'
    reason: 모든 사람에게 안전하다는 단정은 근거를 갖추기 어렵다.
    suggestion: '자극 테스트 결과가 있다면 그 범위만 정확히 쓴다'
    severity: 높음
  - pattern: '最高|最強|最上級|絶対|必ず|完全|完璧|100\s?%'
    reason: 최상급·절대 표현은 과장으로 판단될 수 있다.
    suggestion: '구체적인 사실(수치, 성분)로 바꾼다'
    severity: 중간
  - pattern: '数量限定|期間限定|残りわずか|今だけ'
    reason: 한정·긴급성 표현은 실제 조건과 일치해야 한다.
    suggestion: '실제 한정 조건이 있을 때만 쓰고 조건을 함께 표기한다'
    severity: 중간
