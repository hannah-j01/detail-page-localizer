id: us_cosmetics
name: 미국 화장품 표현 주의 목록
applies_to: {country: us, category: skincare}
# 미국 FDA의 화장품/의약품 구분 원칙을 참고한 초안. 법률 검토를 거치지 않았다.
verified: false
reviewed_at: 2026-10-29
references:
  - FDA 'Is It a Cosmetic, a Drug, or Both?' 안내(원문 확인 필요)
rules:
  - pattern: '\b(cures?|treats?|treatment|heals?|heal)\b'
    reason: 치료 표현은 화장품이 아닌 의약품 주장으로 볼 수 있다.
    suggestion: 'soothes, hydrates, conditions 등 외관·사용감 표현으로 바꾼다'
    severity: 높음
  - pattern: '\b(acne|eczema|rosacea|dermatitis)\b'
    reason: 질환명을 언급하면 의약품 주장으로 해석될 수 있다.
    suggestion: '질환명 대신 피부 상태를 묘사하는 표현을 쓴다'
    severity: 중간
  - pattern: 'FDA[- ]?approved|clinically (proven|tested)|dermatologist[- ](tested|recommended)'
    reason: 승인·임상·전문가 표현은 증빙이 필요하다.
    suggestion: '증빙이 없으면 삭제한다'
    severity: 높음
  - pattern: '#\s?1|number one|best[- ]selling|\bbest\b|guarantee'
    reason: 순위·보장 표현은 근거가 필요하다.
    suggestion: '근거가 없으면 삭제하거나 구체적인 사실로 바꾼다'
    severity: 중간
