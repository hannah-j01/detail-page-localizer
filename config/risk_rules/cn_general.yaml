id: cn_general
name: 중국 광고법 절대·최상급 표현 주의 목록
applies_to: {country: cn, category: any}
# 중국 광고법 제9조(国家级·最高级·最佳 등 사용 금지)와 일반 원칙을 참고해 만든 초안이다.
# 법률 검토를 거친 목록이 아니므로 verified: false. 탐지 결과는 '추가 검토 필요' 신호일 뿐이다.
verified: false
reviewed_at: 2026-11-16
references:
  - 中华人民共和国广告法 第九条(원문 확인 필요)
rules:
  - pattern: '国家级|最高级|最佳|最好|最优|最强|顶级|极品|第一|No\.?\s?1|唯一|首个|首选|销量第一|全网第一'
    reason: 광고법 제9조가 금지하는 절대·최상급 표현이거나 객관적 근거가 필요한 순위·독점 표현이다.
    suggestion: '삭제하거나 구체적인 사실(수치, 성분)로 바꾼다'
    severity: 높음
  - pattern: '100\s?%|纯天然|零添加|无添加|绝对|保证|永久|神奇'
    reason: 절대 표현이나 검증하기 어려운 무첨가·천연 주장은 허위·과장 광고로 판단될 수 있다.
    suggestion: '근거가 없으면 삭제하고, 무첨가 표현은 구체적인 성분명으로 바꾼다(예 不含香精)'
    severity: 높음
  - pattern: '限量|限时|仅剩|最后.{0,2}(天|件|机会)|秒杀'
    reason: 한정·긴급성 표현은 실제 조건과 일치해야 한다.
    suggestion: '실제 한정 조건이 있을 때만 쓰고 조건을 함께 표기한다'
    severity: 중간
